<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with Safe Margin (10-15% margin suitable for Android maskable) -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#accent)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Radar / ComVision Optics Grids (Inside 80% Safe Zone) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Crosshair Reticle -->
  <line x1="256" y1="90" x2="256" y2="422" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6"/>
  <line x1="90" y1="256" x2="422" y2="256" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Candlestick Visual Confluence -->
  <!-- Candle 1 (Down) -->
  <line x1="180" y1="180" x2="180" y2="340" stroke="#ef4444" stroke-width="3"/>
  <rect x="170" y="200" width="20" height="90" rx="4" fill="url(#bear)"/>

  <!-- Candle 2 (Displacement Up) -->
  <line x1="240" y1="140" x2="240" y2="360" stroke="#10b981" stroke-width="3"/>
  <rect x="230" y="160" width="20" height="150" rx="4" fill="url(#bull)" filter="url(#glow)"/>

  <!-- Candle 3 (Expansion / Mitigation) -->
  <line x1="300" y1="120" x2="300" y2="310" stroke="#10b981" stroke-width="3"/>
  <rect x="290" y="140" width="20" height="110" rx="4" fill="url(#bull)"/>

  <!-- Fair Value Gap Bracket (ICT FVG) -->
  <rect x="165" y="250" width="160" height="40" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2" rx="4"/>

  <!-- Engine Monogram & Shield Node -->
  <circle cx="256" cy="256" r="18" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="256" cy="256" r="6" fill="#38bdf8"/>

  <!-- Corner Status Nodes -->
  <circle cx="110" cy="110" r="6" fill="#10b981"/>
  <circle cx="402" cy="110" r="6" fill="#06b6d4"/>
  <circle cx="110" cy="402" r="6" fill="#6366f1"/>
  <circle cx="402" cy="402" r="6" fill="#f59e0b"/>
</svg>
