name: Full Test Suite & Gate Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  fast-feedback:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Fast Unit Tests and Memory-Capped Gate
        run: |
          npx tsx test/ui_truthfulness.test.ts
          npx tsx test/p0_merge_blockers.test.ts
          npx tsx test/strategy_v3_engine.test.ts
          npx tsx test/provider_scheduler_concurrency.test.ts
          npm run test:gate-renumber

      - name: Report Fast Feedback Failure
        if: failure()
        run: |
          echo "::warning::PR validation failed. Inspect the unit-test output and the 512 MiB gate result."

  full-test-suite:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: '--max-old-space-size=1024'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Test Suite with Memory Limit
        run: |
          echo "Running full npm test suite with NODE_OPTIONS=--max-old-space-size=1024..."
          npm test

      - name: Report Full Test Failure
        if: failure()
        run: |
          echo "::warning::Full npm test failed or exceeded the 15 minute timeout. Inspect the first failing test and memory output."
